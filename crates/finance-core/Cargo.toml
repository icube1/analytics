[package]
name = "finance-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic, platform-neutral finance calculations"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "finance-core-fixture"
path = "src/bin/finance-core-fixture.rs"

[[bench]]
name = "resilience"
path = "benches/resilience.rs"
harness = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1.9.0"

[lints]
workspace = true
