[package]
name = "finance-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.88"
description = "Low-resource Axum modular-monolith API foundation"

[[bin]]
name = "finance-api"
path = "src/main.rs"

[[bin]]
name = "finance-api-migrate"
path = "src/bin/finance-api-migrate.rs"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.7.9", features = ["macros"] }
axum-extra = { version = "0.9.6", features = ["cookie"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
finance-core = { path = "../finance-core" }
hmac = "0.12.1"
rand = "0.8.5"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "json", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.12"
time = "0.3.41"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tower-http = { version = "0.5.2", features = ["cors", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.4"
uuid = { version = "1.18.0", features = ["serde", "v4"] }

[dev-dependencies]
axum-test = "16.4.1"
hmac = "0.12.1"
sha2 = "0.10.9"
tempfile = "3.21.0"
wiremock = "0.6.4"

[lints]
workspace = true
