[package]
name = "finance-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.88"
description = "Low-resource Axum modular-monolith API foundation"

[[bin]]
name = "finance-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "migrate",
    "chrono",
    "json",
    "macros",
] }
subtle = "2.6.1"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.5.2", features = ["cors", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }

[dev-dependencies]
axum-test = "16.4.1"
tempfile = "3.21.0"

[lints]
workspace = true
