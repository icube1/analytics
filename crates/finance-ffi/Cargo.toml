[package]
name = "finance-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UniFFI mobile-native bindings for finance-core batch evaluation"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "finance_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
finance-core = { path = "../finance-core" }
serde_json = "1.0.151"
thiserror = "2.0.17"
uniffi = { version = "0.27.3", features = ["bindgen-tests"] }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
