name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          npm ci
          npm run build
          bash scripts/prepare-standalone.sh
          bash scripts/package-deploy.sh deploy.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: |
            deploy.tar.gz
            deploy/analytics.service
            deploy/apply-production-release.sh
            deploy/nginx-analytics.conf
          retention-days: 7

  platform-package:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CI_REPORT_DIR: ${{ github.workspace }}/ci-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: |
          npm ci
          bash scripts/package-platform-release.sh platform-release.tar.gz
          PLATFORM_APP_ROOT="$PWD/.platform-local/opt/analytics-platform" \
            bash scripts/deploy-platform-release.sh platform-release.tar.gz --local
      - uses: actions/upload-artifact@v4
        with:
          name: platform-release-bundle
          path: |
            platform-release.tar.gz
            ci-reports/platform-release.json
            ci-reports/platform-smoke.json
            deploy/blue-green/
            deploy/stage-platform-release.sh
            scripts/deploy-platform-release.sh
            scripts/smoke-platform-release.sh
            scripts/rollback-platform-release.sh
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: package
    if: github.repository == 'icube1/analytics'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: >-
            deploy.tar.gz,
            deploy/analytics.service,
            deploy/apply-production-release.sh,
            deploy/nginx-analytics.conf
          target: /tmp/analytics-deploy
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            chmod +x /tmp/analytics-deploy/deploy/apply-production-release.sh
            bash /tmp/analytics-deploy/deploy/apply-production-release.sh

  platform-stage:
    runs-on: ubuntu-latest
    needs: platform-package
    if: github.repository == 'icube1/analytics'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-release-bundle
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: >-
            platform-release.tar.gz,
            deploy/blue-green/finance-api.service,
            deploy/stage-platform-release.sh,
            scripts/deploy-platform-release.sh,
            scripts/smoke-platform-release.sh
          target: /tmp/analytics-platform-deploy
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            chmod +x /tmp/analytics-platform-deploy/deploy/stage-platform-release.sh
            bash /tmp/analytics-platform-deploy/deploy/stage-platform-release.sh
