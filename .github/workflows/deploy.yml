name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          npm ci
          npm run build
          bash scripts/prepare-standalone.sh
          bash scripts/package-deploy.sh deploy.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: |
            deploy.tar.gz
            deploy/analytics.service
            deploy/nginx-analytics.conf
          retention-days: 7

  platform-package:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CI_REPORT_DIR: ${{ github.workspace }}/ci-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: |
          npm ci
          bash scripts/package-platform-release.sh platform-release.tar.gz
          PLATFORM_APP_ROOT="$PWD/.platform-local/opt/analytics-platform" \
            bash scripts/deploy-platform-release.sh platform-release.tar.gz --local
      - uses: actions/upload-artifact@v4
        with:
          name: platform-release-bundle
          path: |
            platform-release.tar.gz
            ci-reports/platform-release.json
            ci-reports/platform-smoke.json
            deploy/blue-green/
            scripts/deploy-platform-release.sh
            scripts/smoke-platform-release.sh
            scripts/rollback-platform-release.sh
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: package
    if: github.repository == 'icube1/analytics'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy.tar.gz,deploy/analytics.service,deploy/nginx-analytics.conf
          target: /tmp/analytics-deploy
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/analytics
            RELEASE_DIR=/tmp/analytics-deploy
            if ! command -v node >/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            if ! command -v nginx >/dev/null; then
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
            if ! id analytics >/dev/null 2>&1; then
              useradd --system --home-dir "$APP_DIR" --shell /usr/sbin/nologin analytics
            fi
            AUTH_ENV=/etc/analytics-auth.env
            umask 077
            if [ ! -s "$AUTH_ENV" ]; then
              ANALYTICS_AUTH_USER=owner
              ANALYTICS_AUTH_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
              printf 'ANALYTICS_AUTH_USER=%s\nANALYTICS_AUTH_PASSWORD=%s\n' \
                "$ANALYTICS_AUTH_USER" "$ANALYTICS_AUTH_PASSWORD" > "$AUTH_ENV"
            fi
            if ! grep -q '^ANALYTICS_SESSION_SECRET=' "$AUTH_ENV"; then
              printf 'ANALYTICS_SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$AUTH_ENV"
            fi
            if ! grep -q '^ANALYTICS_AUTH_DISPLAY_NAME=' "$AUTH_ENV"; then
              printf 'ANALYTICS_AUTH_DISPLAY_NAME=%s\n' 'Администратор' >> "$AUTH_ENV"
            fi
            if ! grep -q '^ANALYTICS_ADMIN_LOGIN=' "$AUTH_ENV"; then
              printf 'ANALYTICS_ADMIN_LOGIN=admin\n' >> "$AUTH_ENV"
            fi
            chmod 600 "$AUTH_ENV"
            . "$AUTH_ENV"
            API_ENV=/etc/analytics-finance-api.env
            if [ ! -s "$API_ENV" ]; then
              {
                printf '%s\n' "FINANCE_API_BOOTSTRAP_EMAIL=admin@gala-soft.ru"
                printf '%s\n' "FINANCE_API_BOOTSTRAP_PASSWORD=$ANALYTICS_AUTH_PASSWORD"
                printf '%s\n' "FINANCE_API_BOOTSTRAP_DISPLAY_NAME=Администратор"
                printf '%s\n' "FINANCE_API_BOOTSTRAP_HOUSEHOLD_NAME=Household"
              } > "$API_ENV"
              chmod 600 "$API_ENV"
            fi
            install -d -o analytics -g analytics -m 700 \
              "$APP_DIR/data" "$APP_DIR/data/backups" "$APP_DIR/statements"
            tar -xzf "$RELEASE_DIR/deploy.tar.gz" -C "$APP_DIR"
            chown -R analytics:analytics "$APP_DIR"
            install -m 644 "$RELEASE_DIR/deploy/analytics.service" /etc/systemd/system/analytics.service
            systemctl daemon-reload
            systemctl enable analytics
            systemctl restart analytics
            install -m 644 "$RELEASE_DIR/deploy/nginx-analytics.conf" /etc/nginx/sites-available/analytics
            ln -sf /etc/nginx/sites-available/analytics /etc/nginx/sites-enabled/analytics
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable nginx
            systemctl reload nginx
            sleep 2
            if ! curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              journalctl -u analytics -n 80 --no-pager || true
              exit 1
            fi
            if ! curl -fsS -u "$ANALYTICS_AUTH_USER:$ANALYTICS_AUTH_PASSWORD" \
              -o /dev/null http://127.0.0.1:3000/; then
              journalctl -u analytics -n 80 --no-pager || true
              exit 1
            fi
            echo "Deploy OK"

  platform-stage:
    runs-on: ubuntu-latest
    needs: platform-package
    if: github.repository == 'icube1/analytics'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-release-bundle
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: >-
            platform-release.tar.gz,
            deploy/blue-green/finance-api.service,
            scripts/deploy-platform-release.sh,
            scripts/smoke-platform-release.sh
          target: /tmp/analytics-platform-deploy
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            if [[ "${PLATFORM_CUTOVER:-0}" == "1" ]]; then
              echo "Refusing automated stage when PLATFORM_CUTOVER=1" >&2
              exit 1
            fi
            DEPLOY_ROOT=/tmp/analytics-platform-deploy
            TARBALL="$DEPLOY_ROOT/platform-release.tar.gz"
            install -d /opt/analytics-platform
            chmod +x "$DEPLOY_ROOT/scripts/"*.sh
            PLATFORM_APP_ROOT=/opt/analytics-platform \
              bash "$DEPLOY_ROOT/scripts/deploy-platform-release.sh" "$TARBALL"
            echo "Platform staged (Next public vhost unchanged)"
