name: Deploy test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    if: github.repository == 'icube1/analytics'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          npm ci
          npx jest __tests__/server-auth.test.ts --runInBand --forceExit
          npm run build
          bash scripts/prepare-standalone.sh
          bash scripts/package-deploy.sh deploy.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: test-deploy-bundle
          path: |
            deploy.tar.gz
            deploy/analytics-test.service
            deploy/apply-test-release.sh
            deploy/nginx-analytics-test.conf
            deploy/nginx-analytics-test.http.conf
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: package
    if: github.repository == 'icube1/analytics'
    env:
      TEST_REF: ${{ github.head_ref || github.ref_name }}
      TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-deploy-bundle
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: >-
            deploy.tar.gz,
            deploy/analytics-test.service,
            deploy/apply-test-release.sh,
            deploy/nginx-analytics-test.conf,
            deploy/nginx-analytics-test.http.conf
          target: /tmp/analytics-test-deploy
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: TEST_REF,TEST_SHA
          script: |
            chmod +x /tmp/analytics-test-deploy/deploy/apply-test-release.sh
            bash /tmp/analytics-test-deploy/deploy/apply-test-release.sh
