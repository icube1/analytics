server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gala-soft.ru www.gala-soft.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name gala-soft.ru www.gala-soft.ru _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gala-soft.ru www.gala-soft.ru;

    ssl_certificate /etc/letsencrypt/live/gala-soft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gala-soft.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
