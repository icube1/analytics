# Loopback-only platform preview. Does not bind public interfaces and does not
# require app./api./metrics. DNS. Safe to enable while Next remains on :443.
server {
    listen 127.0.0.1:9080;
    server_name _;
    root /opt/analytics-platform/staging/current/site/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:9081;
    server_name _;
    client_max_body_size 10m;
    root /opt/analytics-platform/staging/current/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:9082;
    server_name _;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 127.0.0.1:9083;
    server_name _;
    root /opt/analytics-platform/staging/current/metrics-dashboard/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
